<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Geometry Dash</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        h1 {
            margin-bottom: 5px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
        }

        p {
            margin-top: 0;
            color: #888;
        }

        /* Oyun Alanı */
        #gameCanvas {
            background: linear-gradient(to bottom, #1a0033, #000022);
            border: 4px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            border-radius: 8px;
            cursor: pointer;
        }

        .info {
            margin-top: 15px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>GEOMETRY DASH</h1>
    <p>Zıplamak için <b>BOŞLUK (SPACE)</b> tuşuna bas veya <b>EKRANA TIKLA</b>!</p>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div class="info">
        En Yüksek Skor: <span id="highScoreText">0</span>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const highScoreText = document.getElementById("highScoreText");

        // Oyun Değişkenleri
        let score = 0;
