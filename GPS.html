<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASS APP GPS</title>
<style>
  body{margin:0;font-family:Arial,sans-serif}
  header{background:#0078ff;color:white;text-align:center;padding:15px;font-size:24px}
  .search-box{padding:10px;text-align:center}
  input{width:70%;padding:10px;font-size:16px}
  button{padding:10px 20px;font-size:16px;cursor:pointer}
  iframe{width:100%;height:80vh;border:0}
</style>
</head>
<body>

<header>ASS APP GPS</header>

<div class="search-box">
  <input type="text" id="location" placeholder="Bir yer yaz..."
         onkeydown="if(event.key==='Enter') searchLocation()">
  <button onclick="searchLocation()">Ara</button>
</div>

<iframe id="map"
  src="https://www.google.com/maps?q=Türkiye&output=embed"></iframe>

<script>
function searchLocation(){
  const place = document.getElementById("location").value.trim();
  if(!place) return;
  document.getElementById("map").src =
    "https://www.google.com/maps?q=" + encodeURIComponent(place) + "&output=embed";
}
</script>

</body>
</html>
