<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Animasyon Laboratuvarı</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --success-color: #4ade80;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        h1 {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .panel {
            background-color: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        /* Sahne Alanı */
        .stage {
            height: 300px;
            background-color: #020617;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            border: 2px dashed #334155;
        }

        /* Animasyona Uğrayacak Obje */
        .box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #38bdf8, #ec4899);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        /* Kontrol Elemanları */
        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #94a3b8;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            color: white;
            border: 1px solid #334155;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .code-box {
            background-color: #020617;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
            color: #6ee7b7;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #1e293b;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* ---- CSS ANİMASYON TANIMLARI ---- */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); animation-timing-function: cubic-bezier(0.8,0,1,1); }
            50% { transform: translateY(-100px); animation-timing-function: cubic-bezier(0,0,0.2,1); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; box-shadow: 0 0 40px rgba(236, 72, 153, 0.8); }
        }

        @keyframes flip {
            0% { transform: perspective(400px) rotateY(0); }
            100% { transform: perspective(400px) rotateY(360deg); }
        }

        @keyframes fade {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ Canlı Animasyon Laboratuvarı</h1>

        <div class="panel">
            <h2>Önizleme Sahnesi</h2>
            <div class="stage">
                <div class="box" id="animatedBox"></div>
            </div>
            <button onclick="animasyonuYenidenBaslat()">Animasyonu Tetikle / Yeniden Başlat</button>
        </div>

        <div class="panel">
            <h2>Ayarlar ve Kontroller</h2>
            
            <div class="control-group">
                <label for="animSelect">Animasyon Türü Seçin:</label>
                <select id="animSelect" onchange="animasyonuGuncelle()">
                    <option value="bounce">Zıplama (Bounce)</option>
                    <option value="spin">Dönme (Spin)</option>
                    <option value="pulse">Nabız/Büyüme (Pulse)</option>
                    <option value="flip">Kart Çevirme (Flip)</option>
                    <option value="fade">Yeniden Doğma (Fade)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="speedRange">Animasyon Süresi (Hız): <span id="speedValue">1s</span></label>
                <input type="range" id="speedRange" min="0.2" max="4" step="0.1" value="1" oninput="animasyonuGuncelle()">
            </div>

            <div class="control-group">
                <label for="infiniteCheck">
                    <input type="checkbox" id="infiniteCheck" checked onchange="animasyonuGuncelle()"> Sonsuz Döngü (Infinite)
                </label>
            </div>

            <div class="control-group">
                <label>Oluşan CSS Kodu:</label>
                <div class="code-box" id="cssCodeDisplay">/* CSS buraya gelecek */</div>
                <button style="background-color: var(--success-color);" onclick="koduKopyala()">CSS Kodunu Kopyala</button>
            </div>
        </div>
    </div>

    <script>
        function animasyonuGuncelle()
