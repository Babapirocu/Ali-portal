<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLL 2026 BIOGLOW - Open World Astro Bot</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', sans-serif;
      background-color: #080c19;
      color: #fff;
    }

    /* 🔒 ŞİFRE GİRİŞ EKRANI (AUTH OVERLAY) */
    #auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, #0f172a 0%, #080c19 100%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-card {
      background: rgba(16, 24, 48, 0.9);
      border: 2px solid #00f2fe;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
      padding: 35px;
      border-radius: 28px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .auth-card h1 {
      font-size: 1.6rem;
      color: #00f2fe;
      margin-bottom: 8px;
    }

    .auth-card p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .auth-input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .auth-input-group input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: 2px solid #1e293b;
      background: #090d1a;
      color: #fff;
      font-size: 1.1rem;
      font-family: inherit;
      outline: none;
      text-align: center;
      transition: all 0.2s;
    }

    .auth-input-group input:focus {
      border-color: #00f2fe;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }

    .auth-btn {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #00e676, #00f2fe);
      color: #080c19;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .auth-btn:active {
      transform: scale(0.97);
    }

    .auth-error {
      color: #ff5252;
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 20px;
    }

    /* 🎮 OYUN EKRANI VE CANVAS */
    #game-layout {
      display: none; /* Şifre girilince açılacak */
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #0b1120;
    }

    /* HUD Üst Bar */
    .hud-header {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .hud-badge {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #00f2fe;
      padding: 8px 18px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      font-weight: 700;
      color: #00f2fe;
      font-size: 1rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .hud-stats {
      pointer-events: auto;
      display: flex;
      gap: 12px;
    }

    .stat-pill {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #1e293b;
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .health-bar-bg {
      width: 90px;
      height: 10px;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }

    .health-bar-fill {
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, #00e676, #00f2fe);
      transition: width 0.3s;
    }

    /* Sağ Taraf - Scratch Otonom Kodlama Paneli */
    .code-panel {
      position: absolute;
      top: 75px;
      right: 15px;
      width: 290px;
      max-height: calc(100vh - 170px);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #00f2fe;
      border-radius: 20px;
      padding: 14px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #00f2fe;
      display: flex;
      justify-content: space-between;
    }

    .block-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .btn-block {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 6px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-block:hover {
      background: #00f2fe;
      color: #080c19;
    }

    .code-stack {
      flex: 1;
      background: rgba(8, 12, 25, 0.7);
      border: 2px dashed #334155;
      border-radius: 12px;
      padding: 8px;
      min-height: 140px;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stack-item {
      background: #1e293b;
      border: 1px solid #00f2fe;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stack-item.active {
      background: #ffd700;
      color: #000;
      font-weight: bold;
    }

    .btn-run {
      background: linear-gradient(135deg, #00e676, #00b0ff);
      border: none;
      color: #080c19;
      font-family: inherit;
      font-weight: 800;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-clear {
      background: rgba(255, 82, 82, 0.2);
      border: 1px solid #ff5252;
      color: #ff5252;
      font-family: inherit;
      font-size: 0.8rem;
      padding: 6px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Alt Envanter Barı */
    .bottom-bar {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #00f2fe;
      border-radius: 25px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      backdrop-filter: blur(12px);
    }

    .inventory-item {
      width: 50px;
      height: 50px;
      background: #1e293b;
      border: 2px solid transparent;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
    }

    .inventory-item span {
      font-size: 0.6rem;
      margin-top: 2px;
    }

    .inventory-item.selected {
      border-color: #00f2fe;
      background: rgba(0, 242, 254, 0.2);
    }

    .btn-plant {
      background: linear-gradient(135deg, #00e676, #00b0ff);
      border: none;
      color: #080c19;
      font-family: inherit;
      font-weight: 800;
      padding: 10px 18px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* D-PAD Mobil / Dokunmatik Yön Butonları */
    .dpad {
      position: absolute;
      bottom: 15px;
      left: 15px;
      display: grid;
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(3, 40px);
      gap: 4px;
      z-index: 10;
    }

    .dpad-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #00f2fe;
      color: #fff;
      border-radius: 10px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .dpad-btn:active {
      background: #00f2fe;
      color: #080c19;
    }

    #dpad-u { grid-column: 2; grid-row: 1; }
    #dpad-l { grid-column: 1; grid-row: 2; }
    #dpad-r { grid-column: 3; grid-row: 2; }
    #dpad-d { grid-column: 2; grid-row: 3; }

    /* Bildirim Toast */
    .toast {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: #00e676;
      color: #080c19;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.85rem;
      display: none;
      z-index: 100;
      box-shadow: 0 0 15px rgba(0, 230, 118, 0.5);
    }
  </style>
</head>
<body>

  <!-- 🔒 ŞİFRE GİRİŞ EKRANI -->
  <div id="auth-overlay">
    <div class="auth-card">
      <h1>🤖 FLL 2026 BIOGLOW</h1>
      <p>Açık Dünya Arenasına Giriş Şifresini Yazın</p>
      
      <div class="auth-input-group">
        <input type="password" id="pass-input" placeholder="Şifrenizi Girin..." onkeydown="if(e.key==='Enter') checkAuth()">
      </div>
      
      <button class="auth-btn" onclick="checkAuth()">GİRİŞ YAP 🚀</button>
      <div class="auth-error" id="auth-error"></div>
    </div>
  </div>

  <!-- 🎮 OYUN EKRANI -->
  <div id="game-layout">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div class="hud-header">
      <div class="hud-badge">🌱 ASTRO OPEN WORLD ARENA</div>
      <div class="hud-stats">
        <div class="stat-pill">
          Dikim: <strong id="planted-count" style="color:#00e676; margin-left:4px;">0 / 12</strong>
        </div>
        <div class="stat-pill">
          Ekosistem:
          <div class="health-bar-bg">
            <div id="health-bar" class="health-bar-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- D-Pad Kontrolleri -->
    <div class="dpad">
      <button class="dpad-btn" id="dpad-u" onmousedown="holdDpad('u')" onmouseup="stopDpad()" ontouchstart="holdDpad('u')" ontouchend="stopDpad()">▲</button>
      <button class="dpad-btn" id="dpad-l" onmousedown="holdDpad('l')" onmouseup="stopDpad()" ontouchstart="holdDpad('l')" ontouchend="stopDpad()">◀</button>
      <button class="dpad-btn" id="dpad-r" onmousedown="holdDpad('r')" onmouseup="stopDpad()" ontouchstart="holdDpad('r')" ontouchend="stopDpad()">▶</button>
      <button class="dpad-btn" id="dpad-d" onmousedown="holdDpad('d')" onmouseup="stopDpad()" ontouchstart="holdDpad('d')" ontouchend="stopDpad()">▼</button>
    </div>

    <!-- Scratch Kodlama Paneli -->
    <div class="code-panel">
      <div class="panel-title">
        <span>🧩 Otonom Kodlama</span>
        <span id="stack-count" style="font-size:0.75rem; color:#aaa;">0 Blok</span>
      </div>

      <div class="block-grid">
        <button class="btn-block" onclick="addBlock('FORWARD')">🚀 İleri Git</button>
        <button class="btn-block" onclick="addBlock('LEFT')">↩️ Sola Dön</button>
        <button class="btn-block" onclick="addBlock('RIGHT')">↪️ Sağa Dön</button>
        <button class="btn-block" onclick="addBlock('PLANT')">🌱 Fidan Koy</button>
        <button class="btn-block" onclick="addBlock('CLEAN')">🧹 Kirlilik Sil</button>
      </div>

      <div class="code-stack" id="code-stack">
        <div style="color:#64748b; text-align:center; font-size:0.75rem; margin-top:40px;">
          Komut eklemek için bloklara tıkla.
        </div>
      </div>

      <button class="btn-run" onclick="runCodeStack()">▶️ OTONOM ÇALIŞTIR</button>
      <button class="btn-clear" onclick="clearStack()">🗑️ Temizle</button>
    </div>

    <!-- Alt Envanter Barı -->
    <div class="bottom-bar">
      <div class="inventory-item selected" onclick="selectItem('tree', this)">🌲<span>Fidan</span></div>
      <div class="inventory-item" onclick="selectItem('coral', this)">🪸<span>Mercan</span></div>
      <div class="inventory-item" onclick="selectItem('shroom', this)">🍄<span>Mantar</span></div>
      <div class="inventory-item" onclick="selectItem('bear', this)">🐻‍‍❄️<span>K.Ayısı</span></div>
      <div class="inventory-item" onclick="selectItem('turtle', this)">🐢<span>Kaplumbağa</span></div>
      <div class="inventory-item" onclick="selectItem('bee', this)">🐝<span>Biyo-Arı</span></div>

      <button class="btn-plant" onclick="manualPlant()">📍 YERLEŞTİR</button>
    </div>

    <div id="toast" class="toast">Başarılı! 🌱</div>
  </div>

  <script>
    /* 🔒 ŞİFRE KONTROLÜ */
    function checkAuth() {
      const input = document.getElementById('pass-input').value;
      const errorEl = document.getElementById('auth-error');

      if (input === 'CevreKoleji1998A') {
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('game-layout').style.display = 'block';
        initGame();
      } else {
        errorEl.innerText = '⚠️ Hatalı Şifre! Lütfen tekrar deneyin.';
      }
    }

    /* 🌍 AÇIK DÜNYA DÖNGÜSÜ & ENGINE */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const WORLD_SIZE = 2400; // Dev Açık Dünya Harita Boyutu (2400x2400px)
    const TILE_SIZE = 50;

    let bot = { x: 1200, y: 1200, angle: 0, speed: 4 }; // Açık Dünya Koordinatları
    let camera = { x: 0, y: 0 };
    let keys = {};
    let dpadDir = null;

    let selectedItem = 'tree';
    let plantedItems = [];
    let pollutionItems = [];
    let codeStack = [];
    let isRunningCode = false;
    let health = 20;

    function initGame() {
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // Rastgele Kirlilik Alanları
      for (let i = 0; i < 25; i++) {
        pollutionItems.push({
          x: Math.floor(Math.random() * (WORLD_SIZE - 200) + 100),
          y: Math.floor(Math.random() * (WORLD_SIZE - 200) + 100)
        });
      }

      window.addEventListener('keydown', e => { keys[e.key] = true; if(e.key === ' ') manualPlant(); });
      window.addEventListener('keyup', e => { keys[e.key] = false; });

      requestAnimationFrame(gameLoop);
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function gameLoop() {
      if (!isRunningCode) {
        handleMovement();
      }

      // Kamera Takibi
      camera.x = bot.x - canvas.width / 2;
      camera.y = bot.y - canvas.height / 2;

      // Temizle
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(-camera.x, -camera.y);

      // 1. Zemin Grid / Izgara Çizimi
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let x = 0; x <= WORLD_SIZE; x += TILE_SIZE) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); ctx.stroke();
      }
      for (let y = 0; y <= WORLD_SIZE; y += TILE_SIZE) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); ctx.stroke();
      }

      // Harita Sınırları
      ctx.strokeStyle = '#00f2fe';
      ctx.lineWidth = 4;
      ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

      // 2. Kirlilik Simgeleri
      pollutionItems.forEach(p => {
        ctx.fillStyle = '#ff5252';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('☣️', p.x, p.y);
      });

      // 3. Dikilen Biyo-Canlılar
      plantedItems.forEach(item => {
        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(item.icon, item.x, item.y);
      });

      // 4. Astro Bot Çizimi
      ctx.save();
      ctx.translate(bot.x, bot.y);
      ctx.rotate((bot.angle * 90) * Math.PI / 180);

      // Bot Gövdesi
      ctx.fillStyle = '#00f2fe';
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fill();

      // Bot Vizör
      ctx.fillStyle = '#080c19';
      ctx.fillRect(4, -7, 10, 14);
      ctx.fillStyle = '#00e676';
      ctx.fillRect(10, -4, 3, 8);

      ctx.restore();

      ctx.restore();

      requestAnimationFrame(gameLoop);
    }

    function handleMovement() {
      let mx = 0, my = 0;

      if (keys['ArrowUp'] || keys['w'] || dpadDir === 'u') { my -= bot.speed; bot.angle = 3; }
      if (keys['ArrowDown'] || keys['s'] || dpadDir === 'd') { my += bot.speed; bot.angle = 1; }
      if (keys['ArrowLeft'] || keys['a'] || dpadDir === 'l') { mx -= bot.speed; bot.angle = 2; }
      if (keys['ArrowRight'] || keys['d'] || dpadDir === 'r') { mx += bot.speed; bot.angle = 0; }

      bot.x = Math.max(20, Math.min(WORLD_SIZE - 20, bot.x + mx));
      bot.y = Math.max(20, Math.min(WORLD_SIZE - 20, bot.y + my));
    }

    function holdDpad(dir) { dpadDir = dir; }
    function stopDpad() { dpadDir = null; }

    function selectItem(type, el) {
      selectedItem = type;
      document.querySelectorAll('.inventory-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
    }

    function manualPlant() {
      const icons = { tree: '🌲', coral: '🪸', shroom: '🍄', bear: '🐻‍❄️', turtle: '🐢', bee: '🐝' };
      plantedItems.push({ x: bot.x, y: bot.y, icon: icons[selectedItem] || '🌱' });
      health = Math.min(100, health + 7);
      updateUI();
      showToast('Canlı Yerleştirildi! 🎉');
    }

    /* 🧩 SCRATCH KODLAMA DİZİLİMİ */
    function addBlock(cmd) {
      if (codeStack.length >= 8) return;
      codeStack.push(cmd);
      renderStack();
    }

    function clearStack() {
      codeStack = [];
      renderStack();
    }

    function renderStack() {
      const stackEl = document.getElementById('code-stack');
      document.getElementById('stack-count').innerText = `${codeStack.length} Blok`;

      if (codeStack.length === 0) {
        stackEl.innerHTML = `<div style="color:#64748b; text-align:center; font-size:0.75rem; margin-top:40px;">Komut eklemek için bloklara tıkla.</div>`;
        return;
      }

      const labels = { FORWARD: '🚀 İleri Git', LEFT: '↩️ Sola Dön', RIGHT: '↪️ Sağa Dön', PLANT: '🌱 Fidan Koy', CLEAN: '🧹 Kirlilik Sil' };
      stackEl.innerHTML = codeStack.map((cmd, idx) => `
        <div class="stack-item" id="block-${idx}">
          <span>${idx + 1}. ${labels[cmd]}</span>
        </div>
      `).join('');
    }

    async function runCodeStack() {
      if (codeStack.length === 0 || isRunningCode) return;
      isRunningCode = true;

      for (let i = 0; i < codeStack.length; i++) {
        const itemEl = document.getElementById(`block-${i}`);
        if(itemEl) itemEl.classList.add('active');

        const cmd = codeStack[i];
        const step = 60;

        if (cmd === 'FORWARD') {
          if (bot.angle === 0) bot.x += step;
          if (bot.angle === 1) bot.y += step;
          if (bot.angle === 2) bot.x -= step;
          if (bot.angle === 3) bot.y -= step;
        } else if (cmd === 'LEFT') {
          bot.angle = (bot.angle + 3) % 4;
        } else if (cmd === 'RIGHT') {
          bot.angle = (bot.angle + 1) % 4;
        } else if (cmd === 'PLANT') {
          manualPlant();
        } else if (cmd === 'CLEAN') {
          pollutionItems = pollutionItems.filter(p => {
            const dist = Math.hypot(p.x - bot.x, p.y - bot.y);
            return dist > 50;
          });
          health = Math.min(100, health + 10);
          updateUI();
        }

        await new Promise(r => setTimeout(r, 450));
        if(itemEl) itemEl.classList.remove('active');
      }

      isRunningCode = false;
      showToast('Otonom Kodlama Tamamlandı! 🤖');
    }

    function updateUI() {
      document.getElementById('planted-count').innerText = `${plantedItems.length} / 12`;
      document.getElementById('health-bar').style.width = `${health}%`;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2000);
    }
  </script>
</body>
</html>
