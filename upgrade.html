<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aslan Tycoon</title>

<style>
*{box-sizing:border-box}

body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

button{
    padding:10px 20px;
    margin:5px;
    font-size:18px;
    cursor:pointer;
    border:0;
    border-radius:10px;
    background:#ff9800;
    color:white;
}

button:hover{opacity:.9}

#sifreEkrani{
    position:fixed;
    inset:0;
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.sifreKutu{
    background:white;
    padding:30px;
    border-radius:18px;
    width:min(90%,400px);
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.sifreKutu input{
    width:100%;
    padding:13px;
    font-size:18px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

#oyun{
    display:none;
}

#hayvan{
    width:min(90%,500px);
    height:320px;
    object-fit:cover;
    border-radius:18px;
    margin-top:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

#miniOyun,#dukkan{
    display:none;
    background:white;
    padding:20px;
    margin:20px auto;
    border-radius:15px;
    max-width:650px;
    box-shadow:0 3px 15px rgba(0,0,0,.12);
}

#tiklaBtn{
    width:220px;
    height:100px;
    font-size:28px;
    background:#4caf50;
}

#sure{
    color:red;
    font-weight:bold;
    font-size:24px;
}

#mesaj{
    font-weight:bold;
    min-height:25px;
}

.hayvanEmoji{
    font-size:70px;
    margin:20px;
}
</style>
</head>

<script>
/* ŞİFRE BURADA.
   İstersen sadece 1234 kısmını değiştir. */
const OYUN_SIFRESI = "1234";

let para = 0;
let saniyelikGelir = 1;
let upgradeSayisi = 0;
let tiklama = 0;
let oyunAcik = false;
let sayac = null;

function giris(){
    const girilen = document.getElementById("sifre").value;

    if(girilen === OYUN_SIFRESI){
        document.getElementById("sifreEkrani").style.display = "none";
        document.getElementById("oyun").style.display = "block";
    }else{
        document.getElementById("sifreHata").innerText = "❌ Şifre yanlış!";
    }
}

document.getElementById("sifre").addEventListener("keydown", function(e){
    if(e.key === "Enter") giris();
});

function guncelle(){
    document.getElementById("para").innerText = para.toLocaleString("tr-TR");
    document.getElementById("gelir").innerText = saniyelikGelir.toLocaleString("tr-TR");
    document.getElementById("tiklama").innerText = tiklama;
}

setInterval(function(){
    if(document.getElementById("oyun").style.display !== "none"){
        para += saniyelikGelir;
        guncelle();
    }
},1000);

function upgrade(){
    const fiyat = 50 + (upgradeSayisi * 25);

    if(para < fiyat){
        mesaj("❌ Upgrade için " + fiyat + " ₺ gerekli.");
        return;
    }

    para -= fiyat;
    upgradeSayisi++;
    saniyelikGelir++;

    mesaj("✅ Upgrade başarılı! Saniyelik gelir " + saniyelikGelir + " ₺ oldu.");

    if(upgradeSayisi >= 2){
        document.getElementById("dukkan").style.display = "block";
        mesaj("🛒 2 upgrade tamamlandı! Dükkan açıldı.");
    }

    guncelle();
}

function miniOyunAc(){
    if(oyunAcik) return;

    oyunAcik = true;
    tiklama = 0;

    document.getElementById("miniOyun").style.display = "block";

    let kalanSure = 30;
    document.getElementById("sure").innerText = kalanSure;
    guncelle();

    sayac = setInterval(function(){
        kalanSure--;
        document.getElementById("sure").innerText = kalanSure;

        if(kalanSure <= 0){
            clearInterval(sayac);
            sayac = null;
            oyunAcik = false;
            tiklama = 0;
            document.getElementById("miniOyun").style.display = "none";
            mesaj("⏰ Mini oyun bitti!");
            guncelle();
        }
    },1000);
}

function tikla(){
    if(!oyunAcik) return;

    tiklama++;

    if(tiklama >= 100){
        para += 10;
        tiklama = 0;
        mesaj("🎉 100 tıklama tamamlandı! +10 ₺");
    }

    guncelle();
}

function dukkanAc(){
    if(upgradeSayisi < 2){
        mesaj("🔒 Önce 2 upgrade yapmalısın.");
        return;
    }

    document.getElementById("dukkan").style.display = "block";
}

function hayvanAl(ad,fiyat,emoji){
    if(upgradeSayisi < 2){
        mesaj("🔒 Önce 2 upgrade yapmalısın.");
        return;
    }

    if(para < fiyat){
        mesaj("❌ Yetersiz para!");
        return;
    }

    para -= fiyat;

    document.getElementById("hayvanGoster").innerHTML =
        '<div class="hayvanEmoji">' + emoji + '</div><h3>' +
        ad + ' satın alındı!</h3>';

    mesaj("🎉 " + ad + " satın alındı!");
    guncelle();
}

function mesaj(yazi){
    document.getElementById("mesaj").innerText = yazi;
}

guncelle();
</script>

</html>
