<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Aslan Tycoon</title>

<style>
body{
font-family:Arial;
text-align:center;
background:#f4f4f4;
}

#aslan{
font-size:120px;
margin-top:30px;
}

button{
padding:10px 20px;
margin:5px;
font-size:18px;
cursor:pointer;
}

#miniOyun{
display:none;
margin-top:20px;
}

#tiklaBtn{
width:200px;
height:100px;
font-size:24px;
}

#sure{
font-size:22px;
color:red;
font-weight:bold;
}
</style>

</head>
<body>

<h1>🦁 Aslan Tycoon</h1>

<div id="aslan">🦁</div>

<h2>Para: <span id="para">0</span> ₺</h2>

<button onclick="upgrade()">⬆️ Upgrade</button> <button onclick="miniOyunAc()">🎮 Mini Oyun Başla</button>

<div id="miniOyun">

<h3>Tıklama Oyunu</h3>

<p>Süre: <span id="sure">30</span> saniye</p>

<p>Tıklama: <span id="tiklama">0</span>/100</p>

<button id="tiklaBtn" onclick="tikla()">
TIKLA
</button>

</div>

<script>

let para = 0;
let tiklama = 0;
let upgradeSayisi = 0;
let oyunAcik = false;

let hayvanlar = [
"🐶","🐱","🐰","🐼","🐯",
"🦊","🐸","🐵","🐻","🦁"
];

function guncelle(){
document.getElementById("para").innerText = para;
document.getElementById("tiklama").innerText = tiklama;
}

function upgrade(){

if(para < 50){
alert("50 ₺ gerekli!");
return;
}

para -= 50;
upgradeSayisi++;

if(upgradeSayisi >= 2){

let rastgele =
hayvanlar[Math.floor(Math.random()*hayvanlar.length)];

document.getElementById("aslan").innerText = rastgele;
}

guncelle();

alert("Upgrade başarılı!");

}

function miniOyunAc(){

if(oyunAcik) return;

oyunAcik = true;

document.getElementById("miniOyun").style.display="block";

let kalanSure = 30;

document.getElementById("sure").innerText = kalanSure;

let sayac = setInterval(function(){

kalanSure--;

document.getElementById("sure").innerText = kalanSure;

if(kalanSure <= 0){

clearInterval(sayac);

document.getElementById("miniOyun").style.display="none";

oyunAcik = false;

alert("⏰ Süre doldu!");

}

},1000);

}

function tikla(){

if(!oyunAcik) return;

tiklama++;

if(tiklama >= 100){

para += 10;

tiklama = 0;

alert("🎉 +10 ₺ kazandın!");

}

guncelle();

}

guncelle();

</script>

</body>
</html>
