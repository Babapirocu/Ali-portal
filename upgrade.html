<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Aslan Tycoon</title>

<style>
body{
font-family:Arial;
text-align:center;
background:#f4f4f4;
}

#aslan{
font-size:120px;
margin-top:30px;
}

button{
padding:10px 20px;
margin:5px;
font-size:18px;
cursor:pointer;
}

#miniOyun{
display:none;
margin-top:20px;
}

#tiklaBtn{
width:200px;
height:100px;
font-size:24px;
}
</style>
</head>
<body>

<h1>🦁 Aslan Tycoon</h1>

<div id="aslan">🦁</div>

<h2>Para: <span id="para">0</span> ₺</h2>

<button onclick="upgrade()">⬆️ Upgrade</button>
<button onclick="miniOyunAc()">🎮 Mini Oyun Başla</button>

<div id="miniOyun">
<h3>Tıklama Oyunu</h3>
<p>Tıklama: <span id="tiklama">0</span>/100</p>

<button id="tiklaBtn" onclick="tikla()">
TIKLA
</button>
</div>

<script>

let para = 0;
let saniyelikGelir = 1;
let tiklama = 0;

function guncelle(){
document.getElementById("para").innerText = para;
document.getElementById("tiklama").innerText = tiklama;
}

setInterval(function(){
para += saniyelikGelir;
guncelle();
},1000);

function upgrade(){

if(para >= 50){

para -= 50;
saniyelikGelir++;

alert("Gelir arttı! Yeni gelir: " + saniyelikGelir);

}else{

alert("50 ₺ gerekli!");

}

guncelle();
}

function miniOyunAc(){
document.getElementById("miniOyun").style.display="block";
}

function tikla(){

tiklama++;

if(tiklama >= 100){

para += 10;
tiklama = 0;

alert("🎉 100 tıklama tamamlandı! +10 ₺ kazandın");

}

guncelle();

}

guncelle();

</script>

</body>
</html>
