<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiyoDenge 🌍 - FLL BIOGLOW Astro Bot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #080c19;
      color: #fff;
    }

    /* 🔒 ŞİFRE GİRİŞ EKRANI */
    #auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, #0f172a 0%, #080c19 100%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-card {
      background: rgba(16, 24, 48, 0.95);
      border: 2px solid #00f2fe;
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.3);
      padding: 35px;
      border-radius: 28px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .auth-card h1 {
      font-size: 1.8rem;
      color: #00f2fe;
      margin-bottom: 8px;
    }

    .auth-card p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .auth-input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .auth-input-group input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: 2px solid #1e293b;
      background: #090d1a;
      color: #fff;
      font-size: 1.1rem;
      outline: none;
      text-align: center;
      transition: all 0.2s;
    }

    .auth-input-group input:focus {
      border-color: #00f2fe;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }

    .auth-btn {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #00e676, #00f2fe);
      color: #080c19;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .auth-btn:active {
      transform: scale(0.97);
    }

    .auth-error {
      color: #ff5252;
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 20px;
    }

    /* 🎮 OYUN EKRANI VE CANVAS */
    #game-layout {
      display: none;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #0b1120;
    }

    /* HUD Üst Bar */
    .hud-header {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .hud-badge {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #00f2fe;
      padding: 8px 18px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      font-weight: 700;
      color: #00f2fe;
      font-size: 1rem;
    }

    .hud-stats {
      pointer-events: auto;
      display: flex;
      gap: 12px;
    }

    .stat-pill {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #1e293b;
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .health-bar-bg {
      width: 90px;
      height: 10px;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }

    .health-bar-fill {
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, #00e676, #00f2fe);
      transition: width 0.3s;
    }

    /* Scratch Otonom Kodlama Paneli */
    .code-panel {
      position: absolute;
      top: 75px;
      right: 15px;
      width: 290px;
      max-height: calc(100vh - 170px);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #00f2fe;
      border-radius: 20px;
      padding: 14px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #00f2fe;
      display: flex;
      justify-content: space-between;
    }

    .block-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .btn-block {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 6px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-block:hover {
      background: #00f2fe;
      color: #080c19;
    }

    .code-stack {
      flex: 1;
      background: rgba(8, 12, 25, 0.7);
      border: 2px dashed #334155;
      border-radius: 12px;
      padding: 8px;
      min-height: 140px;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stack-item {
      background: #1e293b;
      border: 1px solid #00f2fe;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stack-item.active {
      background: #ffd700;
      color: #000;
      font-weight: bold;
    }

    .btn-run {
      background: linear-gradient(135deg, #00e676, #00b0ff);
      border: none;
      color: #080c19;
      font-weight: 800;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-clear {
      background: rgba(255, 82, 82, 0.2);
      border: 1px solid #ff5252;
      color: #ff5252;
      font-size: 0.8rem;
      padding: 6px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Alt Envanter Barı */
    .bottom-bar {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #00f2fe;
      border-radius: 25px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      backdrop-filter: blur(12px);
    }

    .inventory-item {
      width: 50px;
      height: 50px;
      background: #1e293b;
      border: 2px solid transparent;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
    }

    .inventory-item span {
      font-size: 0.6rem;
      margin-top: 2px;
    }

    .inventory-item.selected {
      border-color: #00f2fe;
      background: rgba(0, 242, 254, 0.2);
    }

    .btn-plant {
      background: linear-gradient(135deg, #00e676, #00b0ff);
      border: none;
      color: #080c19;
      font-weight: 800;
      padding: 10px 18px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* D-PAD Yön Butonları */
    .dpad {
      position: absolute;
      bottom: 15px;
      left: 15px;
      display: grid;
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(3, 40px);
      gap: 4px;
      z-index: 10;
    }

    .dpad-btn {
      background: rgba(15, 23, 42
